name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # THE SUITE GATES THE DEPLOY. A red main that deploys anyway is barely
  # better than no CI: the site would publish figures the suite has just
  # said are wrong, with the same authority as figures it has verified.
  #
  # WHAT FAILING MEANS FOR A STATIC SITE, and why gating is safe here: this
  # deploys a whole directory, so there is no partial or half-applied state.
  # If the suite fails, upload-pages-artifact never runs, no new deployment
  # is created, and THE PREVIOUS DEPLOY STAYS LIVE — a reader sees the last
  # version that passed, not an error page and not a broken one. The cost of
  # a failure is that a fix waits; the cost of not gating is publishing a
  # figure the project knows to be wrong.
  #
  # Called rather than copied, so the deploy gate cannot drift from the PR
  # check into a weaker second definition of "the tests pass".
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          # The site is static files at the repo root; no build step.
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
